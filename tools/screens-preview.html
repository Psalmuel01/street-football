<!doctype html><html><head><meta charset="utf-8"><title>LSF visual verification fixtures</title><style>#fixture-controls{padding:12px;position:relative;z-index:200;background:#102b25;display:flex;gap:15px;align-items:center}#fixture-controls select{min-height:44px;padding:10px}#fixture-root{margin:20px auto;max-width:1150px}#fixture-root #match-overlay{position:relative;inset:auto;display:flex}#fixture-root .kit-shop{display:block}#fixture-controls p{font:12px sans-serif}</style></head><body data-page="home"><div id="fixture-controls"><p>UI FIXTURE · LOCAL · NO PAYMENTS / PROGRESS</p><label>Screen<select id="fixture-screen"><option value="results">Results</option><option value="pause">Pause</option><option value="shop">Cosmetic shop</option><option value="squad">Squad</option></select></label></div><div id="fixture-root"></div><script type="module">
import '/src/style.css';import '/src/ui/presentation.css';import {resultsMarkup} from '/src/ui/results.ts';import {pauseMarkup} from '/src/ui/pause.ts';import {squadMarkup} from '/src/ui/squad.ts';import {setupKitShop} from '/src/platform/kit-shop.ts';import {Match} from '/src/game/simulation.ts';import {makeRoster} from '/src/content/roster.ts';
const m=new Match();m.configure(0,makeRoster(4),[0,1,2,3,4],'press');m.configure(1,makeRoster(6),[0,1,2,3,4],'counter');m.score=[3,2];m.shots=[7,5];m.possession=[100,80];m.completedPasses=[18,13];m.saves=[3,2];m.state='FULL_TIME';let disconnect;
const root=document.querySelector('#fixture-root'),screen=document.querySelector('#fixture-screen');const priorFetch=window.fetch;let owned=false;
window.fetch=async(url,options)=>String(url).startsWith('/api/')?{ok:true,json:async()=>({products:owned?['night_court_kits']:[]})}:priorFetch(url,options);
function render(){disconnect?.();disconnect=undefined;if(screen.value==='results')root.innerHTML=resultsMarkup(m,4,6,'cage');else if(screen.value==='pause')root.innerHTML='<div id="match-overlay">'+pauseMarkup(m,4,6)+'</div>';else if(screen.value==='squad')root.innerHTML=squadMarkup(makeRoster(4),[0,1,2,3,4],3,[1,1,1,1,1],'press',false,4,'2-2');else{root.innerHTML='<div class="game-home"></div>';const shop=setupKitShop({session:async()=>({session:'preview-session-only'}),purchase:async()=>{owned=true;return {purchaseId:'preview-receipt',productId:'night_court_kits'};},purchases:async()=>[],onPurchase:()=>()=>{}},()=>{});disconnect=shop.disconnect;}}
screen.onchange=render;render();
</script></body></html>
